name: supportflow-api

services:
  postgres:
    image: postgres:17-alpine
    container_name: supportflow-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required (see .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Published for host-side tooling (Prisma CLI, e2e tests). The API reaches
      # the database over the internal network using the "postgres" hostname.
      - '${POSTGRES_HOST_PORT:-5436}:5432'
    networks:
      - supportflow-api-internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: supportflow-api:local
    container_name: supportflow-api-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      SEED_DATABASE: ${SEED_DATABASE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    ports:
      - '${API_HOST_PORT:-3005}:3000'
    networks:
      - supportflow-api-internal

volumes:
  postgres-data:
    name: supportflow-api-postgres-data

networks:
  supportflow-api-internal:
    name: supportflow-api-internal
    driver: bridge
